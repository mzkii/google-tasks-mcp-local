<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .flow{stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-30}}
      @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <text x="640" y="92" text-anchor="middle" font-size="52" font-weight="700" fill="#f8fafc">google-tasks-mcp-local</text>
  <text x="640" y="136" text-anchor="middle" font-size="22" fill="#cbd5e1">Manage Google Tasks from Claude — runs entirely on your machine</text>
  <rect x="540" y="152" width="200" height="4" rx="2" fill="url(#accent)"/>

  <!-- boxes -->
  <g>
    <rect x="110" y="200" width="270" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="245" y="248" text-anchor="middle" font-size="24" font-weight="600" fill="#f8fafc">Claude Code</text>
    <text x="245" y="280" text-anchor="middle" font-size="17" fill="#94a3b8">or Claude Desktop</text>

    <rect x="505" y="190" width="270" height="130" rx="16" fill="#0b3b2e" stroke="#34d399" stroke-width="2.5"/>
    <text x="640" y="238" text-anchor="middle" font-size="24" font-weight="600" fill="#f8fafc">MCP server</text>
    <text x="640" y="268" text-anchor="middle" font-size="17" fill="#a7f3d0">local process</text>
    <text x="640" y="296" text-anchor="middle" font-size="15" fill="#6ee7b7">token stays in ~/.config</text>

    <rect x="900" y="200" width="270" height="110" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="1035" y="248" text-anchor="middle" font-size="24" font-weight="600" fill="#f8fafc">Google Tasks API</text>
    <text x="1035" y="280" text-anchor="middle" font-size="17" fill="#94a3b8">your account only</text>
  </g>
  <line class="flow" x1="388" y1="255" x2="495" y2="255" marker-end="url(#arr)"/>
  <text x="442" y="240" text-anchor="middle" font-size="15" fill="#94a3b8">stdio</text>
  <line class="flow" x1="783" y1="255" x2="890" y2="255" marker-end="url(#arr)"/>
  <text x="837" y="240" text-anchor="middle" font-size="15" fill="#94a3b8">HTTPS</text>

  <!-- chips -->
  <g font-size="16" fill="#e2e8f0" text-anchor="middle">
    <rect x="200" y="350" width="190" height="38" rx="19" fill="#1e293b" stroke="#334155"/><text x="295" y="375">No hosted server</text>
    <rect x="410" y="350" width="200" height="38" rx="19" fill="#1e293b" stroke="#334155"/><text x="510" y="375">2 runtime deps</text>
    <rect x="630" y="350" width="200" height="38" rx="19" fill="#1e293b" stroke="#334155"/><text x="730" y="375">Read-only mode</text>
    <rect x="850" y="350" width="230" height="38" rx="19" fill="#1e293b" stroke="#334155"/><text x="965" y="375">Personal + work profiles</text>
  </g>
</svg>
